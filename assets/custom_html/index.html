
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>Iteration</title>

    <style>


        :root {
            --background-color: rgb(250, 250, 250);
            --loading-bar-background: rgb(250, 250, 250);
            --loading-bar-fill: #000000;
            --loading-text-color: #000000;
        }

        html, body, #canvas {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
        }


        body {
            color: white;
            background-color: black;
            overflow: hidden;
            touch-action: none;
        }

        #canvas {
            display: block;
        }

        #canvas:focus {
            outline: none;
        }

        #status, #status-splash, #status-progress {
            position: absolute;
            left: 0;
            right: 0;
        }

        #status, #status-splash {
            top: 0;
            bottom: 0;
        }

        #status {
            background-color: var(--background-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            gap: 28px;
        }

        #status-splash {
            position: relative;
            display: block;
            width: 220px;
            height: auto;
            max-width: 70%;
            max-height: 45%;
            object-fit: contain;
            margin: 0;
        }

        #status-splash.show-image--false {
            display: none;
        }

        #status-splash.fullsize--true {
            width: 220px;
            height: auto;
            object-fit: contain;
        }

        #status-progress {
            position: relative;
            display: block;
            width: 280px;
            max-width: 75%;
            height: 12px;
            margin: 0;
            padding: 0;
            border: none;
            border-radius: 0;
            appearance: none;
            -webkit-appearance: none;
            background: var(--loading-bar-background);
            overflow: hidden;
        }

        #status-progress::-webkit-progress-bar {
            background: var(--loading-bar-background);
            border-radius: 0;
        }

        #status-progress::-webkit-progress-value {
            background: var(--loading-bar-fill);
            border-radius: 0;
        }

        #status-progress::-moz-progress-bar {
            background: var(--loading-bar-fill);
            border-radius: 0;
        }

        #status-notice {
            background-color: #5b3943;
            border-radius: 0;
            border: 1px solid #9b3943;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            line-height: 1.3;
            margin: 0 2rem;
            overflow: hidden;
            padding: 1rem;
            text-align: center;
            z-index: 1;
        }

        #status-notice {
            display: none;
        }

        #game-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 42px;
            background: #101010;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            box-sizing: border-box;
            z-index: 2000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
        }


        #fullscreen-button {
            width: 32px;
            height: 32px;
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.75;
        }

        #fullscreen-button:hover {
            opacity: 1;
        }

        #fullscreen-button svg {
            width: 19px;
            height: 19px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        body:fullscreen #game-controls {
            display: none;
        }

        :fullscreen #game-controls {
            display: none !important;
        }

        :-webkit-full-screen #game-controls {
            display: none !important;
        }
    </style>

    <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png">
    <link rel="apple-touch-icon" href="index.apple-touch-icon.png">
</head>

<body>

    <canvas id="canvas">
        Your browser does not support the canvas tag.
    </canvas>
    <div id="game-controls">
        <span>ITERATION</span>
        <button id="fullscreen-button" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24">
                <path d="M8 3H3v5"/>
                <path d="M16 3h5v5"/>
                <path d="M3 16v5h5"/>
                <path d="M21 16v5h-5"/>
            </svg>
        </button>
    </div>

    <noscript>
        Your browser does not support JavaScript.
    </noscript>

    <div id="status">

        <img
            id="status-splash"
            src="logo.png"
            alt="Game Logo"
        >

        <progress id="status-progress"></progress>

        <div id="status-notice"></div>

    </div>

    <script src="index.js"></script>

    <script>
        const GODOT_CONFIG = {
            "args": [],
            "canvasResizePolicy": 2,
            "emscriptenPoolSize": 8,
            "ensureCrossOriginIsolationHeaders": true,
            "executable": "index",
            "experimentalVK": false,
            "fileSizes": {
                "index.pck": 661748,
                "index.wasm": 37700666
            },
            "focusCanvas": true,
            "gdextensionLibs": [],
            "godotPoolSize": 4
        };

        const GODOT_THREADS_ENABLED = false;
        const engine = new Engine(GODOT_CONFIG);

        (function () {
            const statusOverlay = document.getElementById('status');
            const statusProgress = document.getElementById('status-progress');
            const statusNotice = document.getElementById('status-notice');

            let initializing = true;
            let statusMode = '';

            function setStatusMode(mode) {
                if (statusMode === mode || !initializing) {
                    return;
                }

                if (mode === 'hidden') {
                    statusOverlay.remove();
                    initializing = false;
                    return;
                }

                statusOverlay.style.visibility = 'visible';
                statusProgress.style.display =
                    mode === 'progress' ? 'block' : 'none';

                statusNotice.style.display =
                    mode === 'notice' ? 'block' : 'none';

                statusMode = mode;
            }

            function setStatusNotice(text) {
                while (statusNotice.lastChild) {
                    statusNotice.removeChild(statusNotice.lastChild);
                }

                const lines = text.split('\n');

                lines.forEach((line) => {
                    statusNotice.appendChild(
                        document.createTextNode(line)
                    );
                    statusNotice.appendChild(
                        document.createElement('br')
                    );
                });
            }

            function displayFailureNotice(err) {
                console.error(err);

                if (err instanceof Error) {
                    setStatusNotice(err.message);
                } else if (typeof err === 'string') {
                    setStatusNotice(err);
                } else {
                    setStatusNotice('An unknown error occurred.');
                }

                setStatusMode('notice');
                initializing = false;
            }

            const missing = Engine.getMissingFeatures({
                threads: GODOT_THREADS_ENABLED,
            });

            if (missing.length !== 0) {
                if (
                    GODOT_CONFIG['serviceWorker'] &&
                    GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] &&
                    'serviceWorker' in navigator
                ) {
                    let serviceWorkerRegistrationPromise;

                    try {
                        serviceWorkerRegistrationPromise =
                            navigator.serviceWorker.getRegistration();
                    } catch (err) {
                        serviceWorkerRegistrationPromise =
                            Promise.reject(
                                new Error('Service worker registration failed.')
                            );
                    }

                    Promise.race([
                        serviceWorkerRegistrationPromise
                            .then((registration) => {
                                if (registration != null) {
                                    return Promise.reject(
                                        new Error('Service worker already exists.')
                                    );
                                }

                                return registration;
                            })
                            .then(() => engine.installServiceWorker()),

                        new Promise((resolve) => {
                            setTimeout(() => resolve(), 2000);
                        }),

                    ]).then(() => {
                        window.location.reload();
                    }).catch((err) => {
                        console.error(
                            'Error while registering service worker:',
                            err
                        );
                    });

                } else {
                    const missingMsg =
                        'Error\nThe following features required to run Godot projects on the Web are missing:\n';

                    displayFailureNotice(
                        missingMsg + missing.join('\n')
                    );
                }

            } else {
                setStatusMode('progress');

                engine.startGame({
                    'onProgress': function (current, total) {
                        if (current > 0 && total > 0) {
                            statusProgress.value = current;
                            statusProgress.max = total;
                        } else {
                            statusProgress.removeAttribute('value');
                            statusProgress.removeAttribute('max');
                        }
                    },
                }).then(() => {
                    setStatusMode('hidden');
                }, displayFailureNotice);
            }
        }());


        const fullscreenButton = document.getElementById("fullscreen-button");
        const gameControls = document.getElementById("game-controls");

        fullscreenButton.addEventListener("click", async () => {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                console.error("Fullscreen error:", error);
            }
        });

        document.addEventListener("fullscreenchange", () => {
            gameControls.style.display = document.fullscreenElement
                ? "none"
                : "flex";
        });
    </script>

</body>
</html>
